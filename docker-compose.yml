name: bulls-cows

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bc
      POSTGRES_PASSWORD: bc
      POSTGRES_DB: bc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bc -d bc"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # ВАЖНО: для клиентов внутри docker-сети advertised должен быть по имени контейнера,
      # иначе другие контейнеры (kafka-ui, твои сервисы) будут получать "localhost" и ломаться.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # single-broker safety
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # dockerized buf so you don't need local protoc
  buf:
    image: bufbuild/buf:1.34.0
    working_dir: /workspace
    volumes:
      - ./:/workspace

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      SERVICE: gateway
      HTTP_ADDR: ":8080"
      AUTH_GRPC_ADDR: "auth:50051"
      MATCHMAKING_GRPC_ADDR: "matchmaking:50052"
      GAME_GRPC_ADDR: "game:50053"
      STATS_GRPC_ADDR: "stats:50054"
      REDIS_ADDR: "redis:6379"
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - matchmaking
      - game
      - stats
      - redis

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    environment:
      SERVICE: auth
      HTTP_ADDR: ":8001"
      GRPC_ADDR: ":50051"
      POSTGRES_DSN: "postgres://bc:bc@postgres:5432/bc?sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "8001:8001"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  matchmaking:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: matchmaking
    environment:
      SERVICE: matchmaking
      HTTP_ADDR: ":8002"
      GRPC_ADDR: ":50052"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "8002:8002"
      - "50052:50052"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  game:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: game
    environment:
      SERVICE: game
      HTTP_ADDR: ":8003"
      GRPC_ADDR: ":50053"
      POSTGRES_DSN: "postgres://bc:bc@postgres:5432/bc?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "8003:8003"
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  stats:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: stats
    environment:
      SERVICE: stats
      HTTP_ADDR: ":8004"
      GRPC_ADDR: ":50054"
      POSTGRES_DSN: "postgres://bc:bc@postgres:5432/bc?sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"
      REDIS_ADDR: "redis:6379"
    ports:
      - "8004:8004"
      - "50054:50054"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  kafkadata:
